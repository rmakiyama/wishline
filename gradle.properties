#Kotlin
kotlin.code.style=official
# Compile inside the Gradle daemon, whose JVM is pinned to JDK 21 by gradle-daemon-jvm.properties.
# The Kotlin daemon reuses any running daemon that satisfies the requested heap regardless of its JVM,
# so an IDE-started daemon on an older JDK would otherwise fail to load JDK 21 compiler plugins.
# The compiler now shares the heap below, so kotlin.daemon.jvmargs would have no effect here.
kotlin.compiler.execution.strategy=in-process

#Gradle
# The heap holds Gradle plus the Kotlin compiler (see the in-process strategy above), and the local
# daemon is long-lived, so metaspace is capped to keep compiler classloaders from accumulating.
org.gradle.jvmargs=-Xmx6144M -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
